name: Tourism MLOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allow manual trigger

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: 1. Data Registration
        run: python tourism_project/model_building/data_register.py

      - name: 2. Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: 3. Model Training + Tracking
        run: python tourism_project/model_building/train.py

      - name: Upload train/test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/train.csv
            tourism_project/data/test.csv

      - name: Commit model back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_model.joblib
          git add tourism_project/deployment/metrics.txt || true
          git diff --staged --quiet || git commit -m "ci: update trained model [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
